<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #333;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            background: #26344a;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: #405574;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 30px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header p {
            color: #777;
            margin-top: 8px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
        }

        .card h3 {
            color: #666;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #526ee0;
        }

        .activity {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .activity h2 {
            margin-bottom: 15px;
        }

        .activity p {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        @media (max-width: 700px) {
            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .sidebar h2 {
                margin-bottom: 15px;
            }

            .main-content {
                padding: 20px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h2>My Dashboard</h2>
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Analytics</a>
                <a href="#">Projects</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="header">
                <h1>Dashboard Overview</h1>
                <p>Welcome back! Here's your summary.</p>
            </header>

            <section class="cards">
                <div class="card">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                </div>

                <div class="card">
                    <h3>Total Sales</h3>
                    <p>₹25,000</p>
                </div>

                <div class="card">
                    <h3>Projects</h3>
                    <p>18</p>
                </div>

                <div class="card">
                    <h3>Messages</h3>
                    <p>42</p>
                </div>
            </section>

            <section class="activity">
                <h2>Recent Activity</h2>
                <p>✔ New project created</p>
                <p>✔ Monthly report updated</p>
                <p>✔ New user registered</p>
            </section>

        </main>
    </div>

</body>
</html>
